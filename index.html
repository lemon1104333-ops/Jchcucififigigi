*{box-sizing:border-box}

input{flex:1;min-width:0}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.g button{padding:10px 0}
.dead #box{border-color:var(--red)}
.dead h2{color:var(--red);font-size:26px;margin:0 0 8px;letter-spacing:.3em}
#fl{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;transition:opacity 1.2s}

function ang(){world(0x070912,[6,35],[0,1.5,3],[0,1.4,-10],()=>{road();const a=ppl('40歳',0,-2.5,{c:0xffffff,s:1.4}),h=new THREE.Mesh(new THREE.TorusGeometry(.25,.03,8,20),new THREE.MeshBasicMaterial({color:0xffe060}));h.position.set(0,2.6,-2.5);h.rotation.x=Math.PI/2;S.add(h);for(const s of[-1,1]){const w=bx(.1,1.7,.9,s*.6,1.6,-2.8,0xffffff);w.rotation.z=s*.5}a.userData.upd=1;die('振り向くと、そこには40歳の天使がいた。\n\n天使は微笑みながら、ゆっくりと近づいてくる。',a,sleep)})}
function sleep(){world(0xcfd4c8,[10,40],[0,1.3,2],[0,1,-3],()=>{bx(10,.1,10,0,0,-1,0xe4e2d4);bx(3,.6,1.6,0,.3,-2,0x8a6a4a)});
 sc('……はっ。\n\n急に、ザグザグで寝てしまっていたようだ。\n\n夢、だったのか……？\n\n手には、ユナイテッドザクザクが握られている。',[['帰る',walk2]],{retry:walk2})}
function walk2(){world(0x070912,[6,35],[0,1.5,3],[0,1.3,-10],road);sc('帰路についていると、どこからか音が聞こえてくる。\n\nドン、カッ、ドン、ドン。\n\n太鼓の達人の音だ。\n\n行く？',[['行く',taiko],['行かない',()=>die(Y+'なんで俺の太鼓代行してくれんかったん？」',true)]],{retry:walk2})}
function taiko(){let miss=0,fin=0,st=performance.now()/1000;const N=[],sp=7;
 world(0x0a0a14,[14,50],[0,11,6],[0,0,-1],()=>{bx(3.2,.1,30,0,0,-8,0x20283a);const r=new THREE.Mesh(new THREE.TorusGeometry(.6,.08,8,24),new THREE.MeshBasicMaterial({color:0xffffff}));r.rotation.x=Math.PI/2;r.position.set(0,.1,3);S.add(r);
  for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.5,12,8),new THREE.MeshBasicMaterial({color:i%3?0xe03030:0x3070e0}));m.scale.y=.4;m.position.set(0,.3,-40);S.add(m);N.push({m,t:2+i*.62,s:0})}
  onTap=()=>{const t=performance.now()/1000-st;let b=null,bd=.22;N.forEach(n=>{if(!n.s&&Math.abs(n.t-t)<bd){bd=Math.abs(n.t-t);b=n}});if(b){b.s=1;b.m.visible=false}};
  upd=()=>{const t=performance.now()/1000-st;N.forEach(n=>{n.m.position.z=3-(n.t-t)*sp;if(!n.s&&t-n.t>.22){n.s=2;n.m.visible=false;miss++;$('txt').textContent='ミス '+miss}});
   if(!fin&&t>N[39].t+1){fin=1;onTap=null;miss===20?sc('ミス '+miss+'\n\nクリア成功！\n\n太鼓の余韻を背に、駅へ向かう。',[['帰る',()=>train('n')]],{retry:taiko}):die(miss+'ミス。\n\n'+Y+'俺のこと煽ってるん？」',true)}}});
 sc('ミス 0',[],{retry:taiko})}
function send(){world(0x151a2a,[8,40],[0,1.5,4],[0,1.3,-6],()=>{stn();const i=ppl('伊丹',0,-1,{c:0x8a909c,s:1.2});upd=t=>{i.rotation.y=Math.sin(t)*.1}});
 sc('改札を出ると、伊丹が待っていた。\n\nユナイテッドザクザクを、そっと差し出す。',[['渡す',()=>{boxItem(0,1.1,-1.6);sc(Y+'……ありがとう」\n\n伊丹は、笑っていた。\n\n――CLEAR\n\nユナイテッドザクザクのおつかい、完了。',[['最初から',s0]])}]],{retry:send})}
s0();
